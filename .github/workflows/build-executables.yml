name: Build executables

# Builds the release files and uploads them as artifacts of the calling run:
# on each release platform, the host tools and the FFI libraries with their
# C++ headers (build_defs/package_release.py); once, the console module
# (build_defs/package_module.py), which is the same on every host.
# release.yml and nightly.yml call it and publish the files.

on:
  workflow_call:
    inputs:
      version:
        description: Version in the file names, for example 0.1.0 or nightly.
        required: true
        type: string
      ref:
        description: Commit to build.
        required: true
        type: string

jobs:
  unix:
    name: ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            module: true
          - os: macos-15
            target: aarch64-apple-darwin
            module: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          extraPullNames: devenv
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Build and archive the host tools and FFI libraries
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: >-
          devenv --profile ci shell -- python3 build_defs/package_release.py
          --version "$VERSION" --target "$TARGET" --out-dir dist

      - name: Build the console module
        if: matrix.module
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          devenv --profile ci shell -- python3 build_defs/package_module.py
          --version "$VERSION" --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: xeedee-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Copy the checkout to a short path
        shell: pwsh
        run: ./ci/prepare-windows-runner.ps1 -Source $env:GITHUB_WORKSPACE -Destination C:\a

      - name: Install DotSlash and Buck2
        shell: pwsh
        working-directory: C:\a
        run: ./bootstrap.ps1

      - name: Build and archive the host tools and FFI libraries
        shell: pwsh
        working-directory: C:\a
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          python build_defs/package_release.py
          --version $env:VERSION --target x86_64-pc-windows-msvc
          --out-dir $env:GITHUB_WORKSPACE\dist

      - uses: actions/upload-artifact@v4
        with:
          name: xeedee-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error
