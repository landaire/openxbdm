name: Build executables

# Builds the released executables with the release profile on each release
# platform, and the FFI libraries with their C++ headers, and uploads the
# archives as artifacts of the calling run. release.yml and nightly.yml call
# it and publish the archives.

on:
  workflow_call:
    inputs:
      version:
        description: Version in the archive names, for example 0.1.0 or nightly.
        required: true
        type: string
      ref:
        description: Commit to build.
        required: true
        type: string

jobs:
  unix:
    name: ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          extraPullNames: devenv
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Build and archive the executables
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: >-
          devenv --profile ci shell -- python3 build_defs/package_release.py
          --version "$VERSION" --target "$TARGET" --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: openxbdm-${{ matrix.target }}
          path: dist/*

  windows:
    name: x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Buck2
        shell: pwsh
        run: ./ci/install-buck2.ps1 -InstallDir C:\buck2

      - name: Copy the checkout to a short path
        shell: pwsh
        run: ./ci/prepare-windows-runner.ps1 -Source $env:GITHUB_WORKSPACE -Destination C:\a -AlsoExclude C:\buck2

      - name: Build and archive the executables
        shell: pwsh
        working-directory: C:\a
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          python build_defs/package_release.py
          --version $env:VERSION --target x86_64-pc-windows-msvc
          --out-dir $env:GITHUB_WORKSPACE\dist

      - uses: actions/upload-artifact@v4
        with:
          name: openxbdm-x86_64-pc-windows-msvc
          path: dist/*

  # The C++ headers come from diplomat-tool, an executable from crates.io
  # that no workspace crate depends on, so Buck2 has no rule for it. Cargo,
  # through rustup and rust-toolchain.toml, builds the libraries the headers
  # describe and installs the tool.
  ffi:
    name: FFI ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            libraries: libopenxbdm_ffi.so libopenxbdm_ffi.a
          - os: macos-15
            target: aarch64-apple-darwin
            libraries: libopenxbdm_ffi.dylib libopenxbdm_ffi.a
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            libraries: openxbdm_ffi.dll openxbdm_ffi.lib
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: openxbdm-ffi-${{ inputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build the FFI libraries
        run: cargo build --locked --release -p openxbdm-ffi

      - name: Generate the C++ bindings
        run: |
          cargo install diplomat-tool --version '^0.15' --locked --root "$RUNNER_TEMP/diplomat"
          "$RUNNER_TEMP/diplomat/bin/diplomat-tool" cpp crates/openxbdm-ffi/bindings/cpp --entry crates/openxbdm-ffi/src/lib.rs

      - name: Stage the archive
        env:
          LIBRARIES: ${{ matrix.libraries }}
        run: |
          mkdir -p "dist/$ARCHIVE/lib" "dist/$ARCHIVE/include"
          for library in $LIBRARIES; do
            cp "target/release/$library" "dist/$ARCHIVE/lib/"
          done
          cp -r crates/openxbdm-ffi/bindings/cpp/. "dist/$ARCHIVE/include/"
          cp README.md "dist/$ARCHIVE/"

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: tar -C dist -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:ARCHIVE" -DestinationPath "dist/$env:ARCHIVE.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: openxbdm-ffi-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
