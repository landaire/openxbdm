name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run checks everything.
  workflow_dispatch:

# Each platform builds and tests only the first-party targets whose code or
# dependencies differ from the last successful run on main (ci/affected.py).
# Changes to build configuration, toolchains, or the checks run everything.
#
# Every platform runs Buck2 through bin/buck2, which fetches the release
# that toolchains/buck2 pins with DotSlash. On Linux and macOS, the devenv
# `ci` profile provides reindeer, Cargo, Python and bazel-remote, and
# Cachix holds the Nix store paths. bazel-remote serves Buck2's action
# cache from a directory that actions/cache keeps between runs; runs on
# main save it, and pull requests read the latest one. Windows has neither
# Nix nor a bazel-remote build, so it runs bootstrap.ps1 and builds without
# the action cache.

permissions:
  contents: read
  # Finding the last successful run on main.
  actions: read

jobs:
  unix:
    name: ${{ matrix.name }}
    strategy:
      # Report every platform instead of cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            checks: true
          - name: macOS arm64
            os: macos-15
            checks: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          extraPullNames: devenv
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      # Action keys cover the linker command but not the compiler driver
      # that it runs from PATH, so each runner image keeps its own cache.
      # actions/cache rejects paths with `..`, and the directory stays
      # outside the Buck2 project.
      - name: Name the action cache
        id: action-cache
        run: |
          echo "prefix=buck2-action-cache-$ImageOS-$ImageVersion-${{ runner.arch }}-" >> "$GITHUB_OUTPUT"
          echo "ACTION_CACHE_DIR=$RUNNER_TEMP/buck2-action-cache" >> "$GITHUB_ENV"

      - name: Restore the Buck2 action cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ACTION_CACHE_DIR }}
          key: ${{ steps.action-cache.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.action-cache.outputs.prefix }}

      - name: Start the action cache
        run: devenv --profile ci shell -- ci/start-action-cache.sh "$ACTION_CACHE_DIR"

      - name: Select the affected targets
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            devenv --profile ci shell -- python3 ci/affected.py select --full \
              --out "$RUNNER_TEMP/openxbdm-affected.json" --github-output "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""') || base=""
          devenv --profile ci shell -- python3 ci/affected.py select --base "$base" \
            --out "$RUNNER_TEMP/openxbdm-affected.json" --github-output "$GITHUB_OUTPUT"

      - name: Check the generated files
        if: matrix.checks && steps.affected.outputs.generated == 'true'
        run: |
          devenv --profile ci shell -- python3 toolchains/update_rustfmt_release.py --check
          devenv --profile ci shell -- python3 build_defs/update_buck_files.py
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Build
        if: steps.affected.outputs.build == 'true'
        run: devenv --profile ci shell -- python3 ci/affected.py run --selection "$RUNNER_TEMP/openxbdm-affected.json" --field build -- bin/buck2 build -m ppc64-ilp32

      - name: Test
        if: steps.affected.outputs.tests == 'true'
        run: devenv --profile ci shell -- python3 ci/affected.py run --selection "$RUNNER_TEMP/openxbdm-affected.json" --field tests -- bin/buck2 test -m ppc64-ilp32

      - name: Check formatting and clippy diagnostics
        if: matrix.checks && steps.affected.outputs.lint == 'true'
        run: devenv --profile ci shell -- python3 ci/affected.py run --selection "$RUNNER_TEMP/openxbdm-affected.json" --field lint -- python3 build_defs/lint.py --targets

      - name: Stop the action cache
        if: always()
        run: |
          devenv --profile ci shell -- bin/buck2 kill
          if [ -f "$ACTION_CACHE_DIR.pid" ]; then kill "$(cat "$ACTION_CACHE_DIR.pid")"; fi

      - name: Save the Buck2 action cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ACTION_CACHE_DIR }}
          key: ${{ steps.action-cache.outputs.prefix }}${{ github.run_id }}

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the checkout to a short path
        shell: pwsh
        run: ./ci/prepare-windows-runner.ps1 -Source $env:GITHUB_WORKSPACE -Destination C:\a

      - name: Install DotSlash and Buck2
        shell: pwsh
        working-directory: C:\a
        run: |
          ./bootstrap.ps1
          Add-Content -Path $env:GITHUB_PATH -Value C:\a\bin

      - name: Select the affected targets
        id: affected
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: C:\a
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            python ci/affected.py select --full --out "$env:RUNNER_TEMP\openxbdm-affected.json" --github-output $env:GITHUB_OUTPUT
            exit $LASTEXITCODE
          }
          $base = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>$null
          if ($LASTEXITCODE -ne 0) {
            $base = ""
          }
          python ci/affected.py select --base "$base" --out "$env:RUNNER_TEMP\openxbdm-affected.json" --github-output $env:GITHUB_OUTPUT

      - name: Build
        if: steps.affected.outputs.build == 'true'
        working-directory: C:\a
        run: python ci/affected.py run --selection "$env:RUNNER_TEMP\openxbdm-affected.json" --field build -- buck2 build -m ppc64-ilp32

      - name: Test
        if: steps.affected.outputs.tests == 'true'
        working-directory: C:\a
        run: python ci/affected.py run --selection "$env:RUNNER_TEMP\openxbdm-affected.json" --field tests -- buck2 test -m ppc64-ilp32
