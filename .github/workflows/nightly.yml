name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

# Publishes the archives of the default branch under an immutable
# `nightly-<commit>` pre-release and updates the `nightly` pre-release alias
# when the branch has moved. Consumers can pin the immutable tag and archive
# checksum; the alias keeps a stable URL for people who want the latest build.

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      head: ${{ steps.compare.outputs.head }}
      immutable: ${{ steps.compare.outputs.immutable }}
    steps:
      - name: Compare the default branch with the last nightly
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A manual run from another branch still builds the default branch.
          branch=$(gh api "repos/$GH_REPO" --jq .default_branch)
          head=$(gh api "repos/$GH_REPO/commits/$branch" --jq .sha)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          immutable="nightly-${head:0:12}"
          echo "immutable=$immutable" >> "$GITHUB_OUTPUT"
          # A missing tag means there is no nightly alias yet. The immutable
          # release check also migrates nightlies published by the old workflow.
          published=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
          if [ "$published" = "$head" ] && gh release view "$immutable" >/dev/null 2>&1; then
            echo "The nightly releases already have $head."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build-executables.yml
    with:
      version: nightly
      ref: ${{ needs.check.outputs.head }}
    secrets: inherit

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.head }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the immutable nightly and update the nightly alias
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ needs.check.outputs.head }}
          IMMUTABLE: ${{ needs.check.outputs.immutable }}
        run: |
          date=$(date -u +%Y-%m-%d)
          python3 build_defs/release_notes.py --version nightly --commit "$HEAD" --date "$date" > "$RUNNER_TEMP/notes.md"

          if ! gh release view "$IMMUTABLE" >/dev/null 2>&1; then
            gh release create "$IMMUTABLE" dist/* \
              --prerelease \
              --target "$HEAD" \
              --title "Nightly $date ($HEAD)" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi
          # `gh release create` reuses an existing tag and ignores --target.
          if gh api "repos/$GH_REPO/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/nightly"
          fi
          gh release create nightly dist/* \
            --prerelease \
            --target "$HEAD" \
            --title "Nightly $date" \
            --notes-file "$RUNNER_TEMP/notes.md"
