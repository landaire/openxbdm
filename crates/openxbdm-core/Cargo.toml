[package]
name = "openxbdm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "XBDM wire-protocol definitions shared by the openxbdm client and server"

[lib]
path = "src/lib.rs"
# Buck2 links doctests against a staticlib of the crate, which this no_std
# crate cannot be without a panic handler. It has no doctests.
doctest = false

[dependencies]
xbox360-sys = "0.1"
