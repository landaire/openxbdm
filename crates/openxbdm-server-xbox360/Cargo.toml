[package]
name = "openxbdm-server-xbox360"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Xbox 360 system debugger module"
publish = false

[[bin]]
name = "openxbdm-server-xbox360"
path = "src/main.rs"

[features]
# Deployment through DEVKIT:\FlashEx: a boot without the marker file
# DEVKIT:\FlashEx\openxbdm.arm removes the override module and restarts.
boot-guard = []

[dependencies]
openxbdm-core = { path = "../openxbdm-core" }
openxbdm-server = { path = "../openxbdm-server" }

# The module targets powerpc-unknown-xbox360, which only build_xbox360.sh
# builds; Buck2 host builds skip it (build_defs/update_buck_files.py).
[package.metadata.buck2]
compatible_with = ["//platforms:xbox360"]
