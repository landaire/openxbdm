[package]
name = "openxbdm-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocation-free XBDM server request dispatch"

[lib]
path = "src/lib.rs"
# Buck2 links doctests against a staticlib of the crate, which this no_std
# crate cannot be without a panic handler. It has no doctests.
doctest = false

[dependencies]
openxbdm-core = { path = "../openxbdm-core" }

[dev-dependencies]
insta = "1.47.2"
