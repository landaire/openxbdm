[tasks.build]
description = "Builds the host tools, the C++ headers and the console module with Buck2"
run = "buck2 build //: //bindings/... //crates/... //xbox360/..."

[tasks.test]
description = "Runs the tests with Buck2"
run = "buck2 test //: //bindings/... //crates/... //xbox360/..."

[tasks.xex]
description = "Builds the console module (openxbdm.xex and the boot-guard build)"
run = "buck2 build //xbox360:openxbdm //xbox360:openxbdm-boot-guard --show-output"

[tasks.lint]
description = "Checks formatting and clippy diagnostics with Buck2"
run = "python3 build_defs/lint.py"

[tasks.fmt]
description = "Formats the workspace crates with the pinned nightly rustfmt"
run = "python3 build_defs/lint.py --format"

[tasks.buckify]
description = "Regenerates the Buck2 build files from the Cargo workspace"
run = "python3 build_defs/update_buck_files.py"
