[package]
name = "openxbdm-kd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Xbox 360 kernel debugger client over kdnet with a GDB remote server"
publish = false

[lib]
name = "openxbdm_kd"
path = "src/lib.rs"

[[bin]]
name = "openxbdm-kd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
gdbstub = "0.7.10"
jiff = { workspace = true }
openxbdm-kd-core = { path = "core" }
rootcause = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
insta = "1.47.2"
