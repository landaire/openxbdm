[package]
name = "openxbdm-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocation-free XBDM server request dispatch"
publish = false

[lib]
path = "src/lib.rs"
# Buck2 links doctests against a staticlib of the crate, which this no_std
# crate cannot be without a panic handler. It has no doctests.
doctest = false

[features]
default = ["smb"]
# File sharing over SMB 2.
smb = ["dep:smb2-server"]

[dependencies]
openxbdm-core = { path = "../core" }
smb2-server = { path = "smb2", optional = true }
xbox360-sys = "0.2"

[dev-dependencies]
insta = "1.47.2"
