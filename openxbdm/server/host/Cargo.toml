[package]
name = "openxbdm-server-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host XBDM server backed by deterministic mocks"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "openxbdm-server"
path = "src/main.rs"

[features]
default = ["smb"]
# SMB file server listener.
smb = ["openxbdm-server/smb"]

[dependencies]
openxbdm-core = { path = "../../core" }
openxbdm-server = { path = "..", default-features = false }
xbox360-sys = "0.2"

[dev-dependencies]
openxbdm-client = { path = "../../client" }
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
