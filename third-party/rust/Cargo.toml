# Third-party crates that the workspace crates use only as dev-dependencies
# or optional dependencies, and the features that only `--all-features`
# enables. Reindeer generates rules and aliases only for the normal
# dependencies that default features enable, and Buck2 builds each
# third-party crate with one feature set, so they are listed here as normal
# dependencies. build_defs/update_buck_files.py fails when one is missing.
#
# This package is a workspace member only so that it shares Cargo.lock with
# the other crates; it has no code.
[package]
name = "openxbdm-third-party"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[dependencies]
futures = "0.3.32"
insta = { version = "1.47.2", features = ["json"] }
